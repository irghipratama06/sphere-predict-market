<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sphere Predict Market</title>
<style>
:root{--bg:#120c07;--card:#1d140d;--line:#3a2718;--tx:#fff4ea;--mut:#b39a85;--yes:#22c55e;--no:#ef4444;--acc:#ff7a1a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-size:17px;margin:0}h1 b{color:var(--acc)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;color:#fff;background:var(--acc)}
button:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:transparent;border:1px solid var(--line);color:var(--tx)}
.on{background:var(--acc);border-color:var(--acc);color:#1a0d00;font-weight:600}
main{max-width:720px;margin:0 auto;padding:16px}
.note{background:#26180e;border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--mut);font-size:13px;margin-bottom:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.chips button{white-space:nowrap;padding:7px 12px;font-size:13px;border-radius:99px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:16px}
.meta{color:var(--mut);font-size:12px;margin-bottom:10px}
.tag{display:inline-block;background:#3a2718;color:var(--acc);border-radius:6px;padding:0 6px;margin-right:6px;font-weight:600}
.bar{height:10px;border-radius:6px;background:var(--no);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--yes)}
.row{display:flex;justify-content:space-between;font-size:13px}
.yes{color:var(--yes)}.no{color:var(--no)}
.bet{display:flex;gap:8px;margin-top:10px}
.bet input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px;font:inherit}
.bet .y{background:var(--yes)}.bet .n{background:var(--no)}
#toast{position:fixed;left:12px;right:12px;bottom:14px;background:#2b1c10;border:1px solid var(--acc);padding:12px;border-radius:12px;display:none;z-index:9}
</style>
</head>
<body>
<header>
  <h1>Sphere <b>Predict</b> Market</h1>
  <div style="display:flex;gap:6px;align-items:center"><span id="bal" style="font-weight:700;color:var(--acc)">0 UCT</span><button id="dbtn" class="ghost" style="padding:8px 10px">Deposit</button><button id="wbtn" style="padding:8px 10px">Connect</button></div>
</header>
<main>
  <div class="note">Testnet only. Deposit testnet <b>UCT</b> from your Sphere wallet, then predict from your balance. Winnings are credited to your balance; withdrawals are paid manually by the admin.</div>
  <div class="chips" id="periods"></div>
  <div class="chips" id="cats"></div>
  <div id="view"></div>
</main>
<div id="toast"></div>

<script type="module">
/* ============ CONFIG — edit on GitHub (pencil icon) ============ */
const CONFIG = {
  appName: 'Sphere Predict Market',
  appUrl: location.origin,
  ESCROW: '@YOUR_NAMETAG_HERE', // Sphere nametag/address that receives stakes
  COIN_ID: 'UCT',
  NETWORK_KEY: 'testnet2',
  INTENT_ACTION: 'send'
};
/* Markets live in markets.json. Only the repo owner can edit it on GitHub. */

const $ = s => document.querySelector(s);
const load = (k,d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } };
const save = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} };
let MARKETS = [], bets = load('spm2_bets', []), bal = load('spm2_bal', 0), hist = load('spm2_hist', []);
let period = 'all', cat = 'All', tab = 'm';
let client = null, identity = null, disconnectFn = null;

function toast(m){ const t=$('#toast'); t.textContent=m; t.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.display='none',5000); }
const short = s => s ? (s.length>18 ? s.slice(0,10)+'…'+s.slice(-6) : s) : '';
const fmt = n => (Math.round(n*100)/100)+'';
const persist = () => { save('spm2_bets',bets); save('spm2_bal',bal); save('spm2_hist',hist); };
const payoutFor = b => { const m=MARKETS.find(x=>x.id===b.mid); if(!m) return 0; const p=pools(m); const sp=b.side==='yes'?p.y:p.n; return b.amt*(p.y+p.n)/(sp||1); };
function settle(){ let ch=false; bets.forEach(b=>{ const m=MARKETS.find(x=>x.id===b.mid); if(m&&m.resolved&&!b.done){ b.done=true; b.won=(b.side===m.resolved); b.payout=b.won?payoutFor(b):0; if(b.won){bal+=b.payout; hist.push({t:'win',amt:b.payout,ts:Date.now()});} ch=true; }}); if(ch) persist(); }
const closed = m => !!m.resolved || Date.now() > Date.parse(m.end);

function pools(m){
  let y=m.yes||0,n=m.no||0;
  bets.filter(b=>b.mid===m.id).forEach(b=>{ b.side==='yes'? y+=b.amt : n+=b.amt });
  return {y,n,pct:Math.round(y/(y+n||1)*100)};
}

function chips(el, items, cur, fn){
  el.innerHTML = items.map(([v,l])=>`<button class="ghost ${v===cur?'on':''}" data-v="${v}">${l}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>fn(b.dataset.v));
}

function render(){
  settle(); $('#bal').textContent=fmt(bal)+' UCT';
  chips($('#periods'), [['all','All'],['daily','Daily'],['weekly','Weekly'],['mine','Portfolio']],
    tab==='p'?'mine':period, v=>{ if(v==='mine'){tab='p'} else {tab='m';period=v} render(); });
  const cats = ['All',...new Set(MARKETS.map(m=>m.cat))];
  $('#cats').style.display = tab==='m' ? 'flex' : 'none';
  chips($('#cats'), cats.map(c=>[c,c]), cat, v=>{cat=v;render()});
  const v = $('#view');
  if(tab==='m'){
    const list = MARKETS.filter(m=>(period==='all'||m.period===period)&&(cat==='All'||m.cat===cat))
      .sort((a,b)=>closed(a)-closed(b)||Date.parse(a.end)-Date.parse(b.end));
    v.innerHTML = list.length ? list.map(m=>{
      const p=pools(m), c=closed(m);
      return `<div class="card"><div class="meta"><span class="tag">${m.period}</span>${m.cat} · ${c?(m.resolved?'Resolved: '+m.resolved.toUpperCase():'Closed'):'closes '+new Date(m.end).toLocaleString()}</div>
      <h3>${m.q}</h3>
      <div class="bar"><i style="width:${p.pct}%"></i></div>
      <div class="row"><span class="yes">YES ${p.pct}%</span><span class="no">NO ${100-p.pct}%</span></div>
      <div class="meta" style="margin:6px 0 0">Pool: ${p.y+p.n} UCT</div>
      <div class="bet"><input type="number" min="1" step="1" placeholder="UCT" id="a-${m.id}" inputmode="decimal" ${c?'disabled':''}>
      <button class="y" data-m="${m.id}" data-s="yes" ${c?'disabled':''}>YES</button><button class="n" data-m="${m.id}" data-s="no" ${c?'disabled':''}>NO</button></div></div>`;
    }).join('') : '<div class="card">No markets here yet.</div>';
    v.querySelectorAll('.bet button').forEach(b=>b.onclick=()=>predict(b.dataset.m,b.dataset.s));
  } else {
    const open=bets.filter(b=>!b.done), inPos=open.reduce((a,b)=>a+b.amt,0);
    const realized=bets.filter(b=>b.done).reduce((a,b)=>a+(b.payout-b.amt),0);
    const pot=open.reduce((a,b)=>a+payoutFor(b),0);
    const name=id=>{const m=MARKETS.find(x=>x.id===id);return m?m.q:id};
    v.innerHTML = `<div class="card"><div class="meta">Portfolio</div>
      <div class="row"><span>Available balance</span><b>${fmt(bal)} UCT</b></div>
      <div class="row"><span>In open positions</span><b>${fmt(inPos)} UCT</b></div>
      <div class="row"><span>Potential payout (open)</span><b>${fmt(pot)} UCT</b></div>
      <div class="row"><span>Realized P&amp;L</span><b class="${realized>=0?'yes':'no'}">${realized>=0?'+':''}${fmt(realized)} UCT</b></div>
      <div class="bet"><button id="pd">Deposit</button><button class="ghost" id="pw">Withdraw</button></div></div>
      <div class="meta">Open positions</div>`+
      (open.length?open.slice().reverse().map(b=>`<div class="card"><h3>${name(b.mid)}</h3><div class="row"><span class="${b.side}">${b.side.toUpperCase()} · ${fmt(b.amt)} UCT</span><span>Payout if right: ${fmt(payoutFor(b))}</span></div></div>`).join(''):'<div class="card">No open positions.</div>')+
      `<div class="meta">Settled</div>`+
      (bets.filter(b=>b.done).length?bets.filter(b=>b.done).reverse().map(b=>`<div class="card"><h3>${name(b.mid)}</h3><div class="row"><span class="${b.side}">${b.side.toUpperCase()} · ${fmt(b.amt)} UCT</span><span class="${b.won?'yes':'no'}">${b.won?'WON +'+fmt(b.payout-b.amt):'LOST -'+fmt(b.amt)}</span></div></div>`).join(''):'<div class="card">Nothing settled yet.</div>')+
      `<div class="meta">Transactions</div>`+
      (hist.length?hist.slice().reverse().map(h=>`<div class="card"><div class="row"><span>${{dep:'Deposit',wd:'Withdraw request',win:'Winnings'}[h.t]||h.t}${h.st?' · '+h.st:''}</span><span>${fmt(h.amt)} UCT</span></div><div class="meta" style="margin:0">${new Date(h.ts).toLocaleString()}</div></div>`).join(''):'<div class="card">No transactions yet.</div>');
    $('#pd').onclick=deposit; $('#pw').onclick=withdraw;
  }
}

async function connect(){
  const btn=$('#wbtn');
  if(client){ try{ await disconnectFn?.() }catch{} client=identity=null; btn.textContent='Connect'; return; }
  btn.disabled=true; btn.textContent='Connecting…';
  try{
    const { autoConnect } = await import('https://esm.sh/@unicitylabs/sphere-sdk@latest/connect/browser');
    const { SPHERE_NETWORKS } = await import('https://esm.sh/@unicitylabs/sphere-sdk@latest/connect');
    const r = await autoConnect({
      dapp:{name:CONFIG.appName,url:CONFIG.appUrl,icon:CONFIG.appUrl+'/favicon.ico'},
      network: SPHERE_NETWORKS[CONFIG.NETWORK_KEY] ?? SPHERE_NETWORKS.testnet2,
      permissions:['identity:read','transfer:request'],
      walletUrl:'https://sphere.unicity.network',
      silent:false
    });
    client=r.client; disconnectFn=r.disconnect; identity=r.connection.identity;
    client.on?.('wallet:disconnected',()=>{client=identity=null;btn.textContent='Connect';});
    btn.textContent = identity.nametag ? '@'+identity.nametag.replace(/^@/,'') : short(identity.directAddress);
    toast('Wallet connected');
  }catch(e){
    toast('Connect failed: '+(e?.message||e?.code||'unknown error'));
    btn.textContent='Connect';
  }
  btn.disabled=false;
}

function predict(mid,side){
  const m = MARKETS.find(x=>x.id===mid);
  if(!m || closed(m)){ toast('This market is closed'); return; }
  const amt = Number($('#a-'+mid).value);
  if(!(amt>0)){ toast('Enter an amount in UCT'); return; }
  if(amt>bal){ toast('Insufficient balance. Tap Deposit first.'); return; }
  bal-=amt; bets.push({mid,side,amt,ts:Date.now()}); persist(); render();
  toast('Placed: '+side.toUpperCase()+' '+fmt(amt)+' UCT');
}

async function deposit(){
  if(!client){ toast('Connect your wallet first'); return; }
  if(CONFIG.ESCROW.includes('YOUR_NAMETAG')){ toast('Owner: set ESCROW in index.html'); return; }
  const amt = Number(prompt('Deposit amount (UCT)'));
  if(!(amt>0)) return;
  try{
    await client.intent(CONFIG.INTENT_ACTION,{recipient:CONFIG.ESCROW,amount:String(amt),coinId:CONFIG.COIN_ID,memo:'deposit'});
    bal+=amt; hist.push({t:'dep',amt,ts:Date.now(),st:'confirmed'}); persist(); render(); toast('Deposited '+fmt(amt)+' UCT');
  }catch(err){
    const c=err?.code;
    if(c===4003) toast('Rejected. Nothing was sent.');
    else if(c===4009) toast('Wallet is locked. Unlock it and try again.');
    else if(c===4201){ hist.push({t:'dep',amt,ts:Date.now(),st:'unconfirmed'}); persist(); render(); toast('Outcome unknown — check your wallet; do NOT retry. Contact admin to credit it.'); }
    else toast('Error: '+(err?.message||'transfer failed'));
  }
}

function withdraw(){
  const amt = Number(prompt('Withdraw amount (UCT) — paid manually by admin'));
  if(!(amt>0)) return;
  if(amt>bal){ toast('Insufficient balance'); return; }
  bal-=amt; hist.push({t:'wd',amt,ts:Date.now(),st:'pending'}); persist(); render();
  toast('Withdrawal requested. Send your wallet address to the admin.');
}

$('#wbtn').onclick=connect; $('#dbtn').onclick=deposit;
try{ MARKETS = await (await fetch('markets.json',{cache:'no-store'})).json(); }
catch{ toast('Could not load markets.json'); }
render();
</script>
</body>
</html>
